name: Post Scheduler
# スケジュール投稿。Secrets の THREADS_TOKENS(トークン) と POSTS_JSON(その日の投稿データ=gzip+base64) で動く。
# 投稿本文・アカウント情報はコードに含めず、すべて Secrets から注入する。
# JST活動帯(07〜24時=UTC 22〜14時)のみ5分ごとに起動。
# ★投稿済み記録 posted/{日付}.json をコミットして永続化(再投稿ループ防止)。concurrencyで直列化されるため、
#   前の実行が記録をpushしてから次が走り、削除されても同じ枠を二度と投げない。

on:
  schedule:
    - cron: '*/5 22,23,0-14 * * *'   # UTC。JST 07:00〜23:55 を5分ごと
  workflow_dispatch: {}

concurrency:
  group: post-scheduler
  cancel-in-progress: false

permissions:
  contents: write                     # posted/ の記録をコミットするため

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 予定投稿を実行
        env:
          THREADS_TOKENS: ${{ secrets.THREADS_TOKENS }}
          POSTS_JSON: ${{ secrets.POSTS_JSON }}
        run: node scripts/post-scheduler.mjs
      - name: 投稿済み記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "記録に変更なし"
          else
            git commit -m "posted log $(date -u +%FT%TZ) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break || sleep 3
            done
          fi
